services:
  db:
    image: postgres:16-alpine
    container_name: oyagokoro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: oyagokoro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Tokyo
    ports:
      - "5432:5432"
    volumes:
      - ./docker/volumes/pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oyagokoro"]
      interval: 10s
      timeout: 5s
      retries: 5
